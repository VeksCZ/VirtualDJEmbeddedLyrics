name: macOS tools

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            variant: AppleSilicon
          - runner: macos-15-intel
            variant: Intel
    runs-on: ${{ matrix.runner }}
    env:
      MACOS_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: cmake -S . -B build-macos -DBUILD_TESTING=ON
      - run: cmake --build build-macos
      - run: ctest --test-dir build-macos --output-on-failure
      - run: bash -n build-macos-tools-release.sh
      - run: ./build-macos-tools-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LRC-apps-macOS-${{ matrix.variant }}
          path: |
            dist/LyricsTools-macOS-${{ matrix.variant }}-*.zip
            dist/LyricsTools-macOS-${{ matrix.variant }}-*.zip.sha256
